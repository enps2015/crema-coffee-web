name: Update Audience Analytics Dashboard

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "audience-dashboard"
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Audience Dashboard SVG
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: |
          python3 scripts/generate_audience_dashboard.py

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet assets/analytics/crema-audience.svg; then
            echo "No changes detected in audience analytics dashboard."
          else
            echo "Audience analytics dashboard updated. Committing changes..."
            git add assets/analytics/crema-audience.svg
            git commit -m "chore(analytics): update CREMA audience dashboard"
            git push origin main
          fi
